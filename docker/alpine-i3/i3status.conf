# ✦ Maclovia — i3status sobre v86 (sin red, sin batería)
general {
    colors = true
    interval = 5
    color_good = "#34d399"
    color_degraded = "#fbbf24"
    color_bad = "#f43f5e"
}

order += "cpu_usage"
order += "memory"
order += "load"
order += "tztime local"

cpu_usage {
    format = "cpu %usage"
}

memory {
    format = "mem %used"
}

load {
    format = "load %1min"
}

tztime local {
    format = "%H:%M"
}
