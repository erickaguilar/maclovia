# ✦ Maclovia — Xorg sobre v86 (framebuffer del kernel)
#
# v86 emula una VGA Bochs (PCI 1234:1111). El driver vesa NO sirve aquí:
# su int10/x86emu no detecta el VESA BIOS ("VESA BIOS not detected").
# El kernel sí engancha la tarjeta con el driver DRM "bochs" (fbcon) y expone
# /dev/fb0, así que X usa el driver fbdev (igual que la imagen GUI de v86).
Section "Device"
    Identifier "v86-vga"
    Driver     "fbdev"
    Option     "fbdev" "/dev/fb0"
EndSection

# Sin GPU no hay OpenGL: evita que Xorg intente cargar libGL (Mesa).
Section "Module"
    Disable "glx"
EndSection

Section "Screen"
    Identifier   "v86-screen"
    Device       "v86-vga"
    DefaultDepth 24
EndSection

# Entrada: libinput (auto-detecta teclado/ratón PS/2 mediante udev).
Section "InputClass"
    Identifier "v86-keyboard"
    MatchIsKeyboard "on"
    Driver "libinput"
EndSection

Section "InputClass"
    Identifier "v86-pointer"
    MatchIsPointer "on"
    Driver "libinput"
EndSection
