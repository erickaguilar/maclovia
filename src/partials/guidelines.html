    <div id="guidelines"></div>
    <!-- Brand Guidelines & Interactive Real Mockups -->
    <section id="guidelines-section" class="container section-padding">
      <div class="section-header section-header-row">
        <div>
          <div class="section-tag">
            <span class="section-tag-line"></span>
            <span data-i18n="guidelines.badge">BRAND GUIDELINES & REAL MOCKUPS</span>
          </div>
          <h2 class="section-title">
            <span data-i18n="guidelines.title">Manual de Marca &</span>
            <span class="font-cookie text-rosa title-accent-script" data-i18n="guidelines.titleAccent">Escenarios Reales</span>
          </h2>
          <p class="section-desc" data-i18n="guidelines.desc">
            El ecosistema de identidad de MACLOVIA. Belleza Maldita aplicado a producción: redes, CLI, navegador web y papelería física.
          </p>
        </div>

        <!-- Main View Switcher: Mockups vs Manual -->
        <div class="guidelines-view-switcher" role="tablist" aria-label="Vistas de guidelines">
          <button id="tabbtn-mockups" class="guidelines-view-btn active" role="tab" aria-selected="true" aria-controls="mockups-sub-section" data-view="mockups-sub-section">
            <svg class="icon icon-stroke"><use href="assets/icons/sprite.svg#icon-layers"></use></svg>
            <span data-i18n="guidelines.tabMockups">Mockups en Vivo</span>
          </button>
          <button id="tabbtn-manual" class="guidelines-view-btn" role="tab" aria-selected="false" aria-controls="guidelines-sub-section" tabindex="-1" data-view="guidelines-sub-section">
            <svg class="icon icon-stroke"><use href="assets/icons/sprite.svg#icon-file-text"></use></svg>
            <span data-i18n="guidelines.tabManual">Manual & Normativa</span>
          </button>
        </div>
      </div>

      <!-- VIEW 1: INTERACTIVE MOCKUPS -->
      <div id="mockups-sub-section" class="guidelines-view-content active" role="tabpanel" aria-labelledby="tabbtn-mockups" tabindex="0">
        <div class="mockup-container">
          <!-- Mockup Sub-Tabs -->
          <div class="mockup-tabs" role="tablist" aria-label="Mockups interactivos">
            <button id="tabbtn-terminal" class="mockup-tab-btn active" role="tab" aria-selected="true" aria-controls="tab-terminal" data-tab="tab-terminal">
              <svg class="icon icon-stroke"><use href="assets/icons/sprite.svg#icon-terminal"></use></svg>
              <span data-i18n="guidelines.mockupTabs.terminal">Terminal CLI Banner</span>
            </button>
            <button id="tabbtn-opengraph" class="mockup-tab-btn" role="tab" aria-selected="false" aria-controls="tab-opengraph" tabindex="-1" data-tab="tab-opengraph">
              <svg class="icon icon-stroke"><use href="assets/icons/sprite.svg#icon-globe"></use></svg>
              <span data-i18n="guidelines.mockupTabs.opengraph">OpenGraph Card (1200×630)</span>
            </button>
            <button id="tabbtn-browser" class="mockup-tab-btn" role="tab" aria-selected="false" aria-controls="tab-browser" tabindex="-1" data-tab="tab-browser">
              <svg class="icon icon-stroke"><use href="assets/icons/sprite.svg#icon-monitor"></use></svg>
              <span data-i18n="guidelines.mockupTabs.browser">Navegador Web & CLI</span>
            </button>
            <button id="tabbtn-card" class="mockup-tab-btn" role="tab" aria-selected="false" aria-controls="tab-card" tabindex="-1" data-tab="tab-card">
              <svg class="icon icon-stroke"><use href="assets/icons/sprite.svg#icon-briefcase"></use></svg>
              <span data-i18n="guidelines.mockupTabs.businessCard">Tarjeta Foil Editorial</span>
            </button>
          </div>

          <div class="mockup-content">
            <include src="guidelines/panel-terminal.html" />
            <include src="guidelines/panel-opengraph.html" />
            <include src="guidelines/panel-browser.html" />
            <include src="guidelines/panel-card.html" />
          </div>
        </div>
      </div>
      <include src="guidelines/view-manual.html" />
    </section>
